name: Playwright

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_NAME: "Rental Agreement Creator"
  NEXT_PUBLIC_APP_DESCRIPTION: "A test deployment of the application for E2E tests."
  NEXT_PUBLIC_COMPANY_NAME: "Mock E2E Company"
  NEXT_PUBLIC_ADDRESS_LINE1: "123 CI Test Street"
  NEXT_PUBLIC_ADDRESS_LINE2: "Hartford, CT 01758"
  NEXT_PUBLIC_DEPLOYMENT_URL: "http://localhost:3000"

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: Cache Build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        run: npm run build

      - name: Upload Static Build
        uses: actions/upload-artifact@v7
        with:
          name: static-build
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e:
    name: Tests (Shard ${{ matrix.shard }} of 4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps --only-shell chromium

      - name: Download Static Build
        uses: actions/download-artifact@v8
        with:
          name: static-build
          path: out/

      - name: Start Static Server
        run: npx serve@14.2.6 out -p 3000 &
        env:
          CI: true

      - name: Wait for Server
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            http://localhost:3000 > /dev/null

      - name: Run Playwright
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=blob,github
        env:
          CI: true

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 1

  report:
    name: Merge Reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-report-*
          path: blob-reports/
          merge-multiple: true

      - name: Merge Reports
        id: merge
        if: ${{ !cancelled() }}
        run: npx playwright merge-reports --reporter=html,junit blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml

      - name: Upload Report
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 0

      - name: Upload Results
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 0

      - name: Publish Report
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: "test-results/junit.xml"
          reporter: "java-junit"
          use-actions-summary: true
          only-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: false
