name: Vitest

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  general:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm i

      - name: Run Vitest
        run: npm run test:ci
